<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/MOPSHub/favicon.svg" type="image/svg+xml">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Applications — MOpsWork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="/MOPSWork/static/api-config.js"></script>
  <script src="/MOPSWork/static/tracker-store.js?v=1"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --color-bg: #f5f7fa; --color-surface: #ffffff; --color-surface-hover: #eef0f2;
      --color-border: #e9edf2; --color-text: #38444d; --color-text-muted: #64748b;
      --color-accent: #00739c; --color-accent-red: #bf1a22; --color-dark: #38444d;
      --color-success: #10b981;
      --radius: 10px; --radius-lg: 12px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font); background: var(--color-bg); color: var(--color-text);
      line-height: 1.6; -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    a { color: var(--color-accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--color-accent-red); }

    .container { max-width: var(--max-width, 1400px); margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

    /* ── Sticky Header ── */
    .site-header {
      background: #ffffff;
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      max-width: var(--max-width, 1400px);
      margin: 0 auto;
      padding: 0 24px;
    }
    .logo {
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--color-accent);
      letter-spacing: -0.02em;
      text-decoration: none;
    }
    .logo:hover { color: var(--color-accent); }
    .nav-links { display: flex; align-items: center; gap: 24px; list-style: none; }
    .nav-links a {
      color: #475569;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--color-accent); }

    /* ── Banner Hero ── */
    .banner {
      background: linear-gradient(135deg, #00739c 0%, #38444d 100%);
      color: #ffffff;
      padding: 64px 0 56px;
    }
    .banner-content {
      max-width: var(--max-width, 1400px);
      margin: 0 auto;
      padding: 0 24px;
    }
    .banner-content h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }
    .banner-content p {
      font-size: 1.05rem;
      color: #cbd5e1;
      max-width: 600px;
    }
    .banner-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 10px; padding: 12px 28px;
      border-radius: 8px; font-family: var(--font); font-size: 0.9rem; font-weight: 600;
      border: none; cursor: pointer; transition: all 0.3s;
    }
    .btn-primary {
      background: #00739c; color: #fff;
    }
    .btn-primary:hover { background: #38444d; }
    .btn-sm { padding: 8px 20px; font-size: 0.82rem; }
    .btn-outline {
      background: transparent; color: var(--color-accent);
      border: 1px solid var(--color-accent); padding: 6px 16px; font-size: 0.78rem;
    }
    .btn-outline:hover { background: rgba(0,115,156,0.06); }

    /* ── Kanban board ── */
    .kanban-board {
      display: flex;
      gap: 16px;
      padding-bottom: 32px;
      overflow-x: auto;
      min-height: calc(100vh - 260px);
      scrollbar-width: thin;
    }
    .kanban-board::-webkit-scrollbar { height: 8px; }
    .kanban-board::-webkit-scrollbar-track { background: var(--color-bg); border-radius: 4px; }
    .kanban-board::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }

    .kanban-column {
      flex: 0 0 280px;
      min-width: 260px;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      background: var(--color-surface-hover);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      max-height: calc(100vh - 260px);
    }

    .kanban-column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .kanban-column-header .col-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .kanban-column-header .col-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .kanban-column-header .col-count {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--color-text-muted);
      background: var(--color-surface);
      padding: 1px 8px;
      border-radius: 100px;
      border: 1px solid var(--color-border);
    }
    .col-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .col-dot.applied { background: var(--color-success); }
    .col-dot.interviewing { background: #2563eb; }
    .col-dot.offer { background: var(--color-accent); }
    .col-dot.withdrawn { background: #d97706; }
    .col-dot.rejected { background: #dc2626; }
    .col-dot.not_applicable { background: #9ca3af; }

    .kanban-cards {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .kanban-cards.drag-over {
      background: rgba(0, 115, 156, 0.04);
      border-radius: 8px;
    }

    /* ── Kanban card ── */
    .kanban-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: grab;
      transition: all 0.15s;
      user-select: none;
    }
    .kanban-card:hover {
      border-color: rgba(0, 115, 156, 0.2);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .kanban-card:active { cursor: grabbing; }
    .kanban-card.dragging {
      opacity: 0.4;
      transform: rotate(1deg);
    }
    .kanban-card.hidden { display: none; }

    .kc-title {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 2px;
    }
    .kc-title a { color: var(--color-text); }
    .kc-title a:hover { color: var(--color-accent); }
    .kc-company { font-size: 0.75rem; color: var(--color-text-muted); margin-bottom: 6px; }
    .kc-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      font-size: 0.7rem;
      color: var(--color-text-muted);
      margin-bottom: 6px;
    }
    .kc-meta .label { font-weight: 600; color: var(--color-text); }
    .kc-match {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--color-accent);
    }
    .kc-date {
      font-size: 0.68rem;
      color: var(--color-text-muted);
    }
    .kc-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 4px;
    }
    .kc-skill {
      font-size: 0.62rem;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(0, 115, 156, 0.06);
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
    }
    .kc-skill.matched {
      background: rgba(16,185,129,0.1);
      color: #059669;
      border-color: rgba(16,185,129,0.2);
    }
    .kc-skill.gap {
      background: rgba(253,121,168,0.06);
      color: #db2777;
      border-color: rgba(253,121,168,0.15);
    }

    .kc-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--color-border);
    }
    .kc-source {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* ── Empty state ── */
    .kanban-empty {
      text-align: center; padding: 24px 16px;
      color: var(--color-text-muted);
      font-size: 0.8rem;
    }
    .kanban-empty a { color: var(--color-accent); font-weight: 600; }

    /* ── Footer ── */
    .site-footer {
      background: #ffffff;
      border-top: 1px solid var(--color-border);
      padding: 20px 0;
      margin-top: auto;
    }
    .footer-inner {
      max-width: var(--max-width, 1400px);
      margin: 0 auto;
      padding: 0 24px;
      text-align: left;
    }
    .site-footer p {
      font-size: 0.825rem;
      color: #94a3b8;
    }

    .main-content {
      flex: 1;
    }

    @media (max-width: 768px) {
      .kanban-column { flex: 0 0 260px; min-width: 220px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">MOpsWork</a>
      <nav class="nav-links">
        <a href="/MOPSWork/jobs.html">Job Scanner</a>
        <a href="/MOPSWork/applications.html" style="color: var(--color-accent); font-weight: 600;">Applications</a>
        <a href="/MOPSWork/skills-in-demand.html">Skills</a>
        <a href="/MOPSWork/samples.html">Samples</a>
        <a href="/MOPSWork/aboutme.html">About Me</a>
      </nav>
    </div>
  </header>

  <section class="banner">
    <div class="banner-content">
      <h1>Applications</h1>
      <p>Track every application. Drag any card between columns to update its status.</p>
      <div class="banner-actions">
        <button class="btn btn-sm btn-outline" onclick="window.__exportCSV()">
          Download All as CSV
        </button>
        <a href="/MOPSWork/jobs.html" class="btn btn-sm btn-primary" style="text-decoration:none;">
          Find More Jobs
        </a>
      </div>
    </div>
  </section>

  <div class="container main-content">
    <div id="boardContainer">
      <div style="text-align:center; padding:48px; color:var(--color-text-muted);">Loading applications...</div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; 2026 MOpsWork. All rights reserved.</p>
    </div>
  </footer>

  <script>
    var API_BASE = window.API_BASE || "http://localhost:8003";

    const COLUMNS = [
      { key: "applied", label: "Applied", dot: "applied" },
      { key: "interviewing", label: "Interviewing", dot: "interviewing" },
      { key: "offer", label: "Offer", dot: "offer" },
      { key: "not_applicable", label: "N/A", dot: "not_applicable" },
      { key: "withdrawn", label: "Withdrawn", dot: "withdrawn" },
      { key: "rejected", label: "Rejected", dot: "rejected" },
    ];

    let allJobs = [];
    let dragSource = null;

    function escapeHtml(str) {
      if (!str) return "";
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    function formatDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      const diff = Date.now() - d.getTime();
      const days = Math.floor(diff / 86400000);
      if (days === 0) return "Today";
      if (days === 1) return "Yesterday";
      if (days < 7) return days + "d ago";
      return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    }

    function fullDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
    }

    function createCardHTML(job) {
      const skills = job.key_skills || [];
      const matched = job.matched_skills || [];
      const gap = (job.skills_gap || []).slice(0, 5);

      return `
        <div class="kanban-card" draggable="true" data-job-id="${escapeHtml(job.job_id)}" data-status="${escapeHtml(job.status || "applied")}">
          <div class="kc-title"><a href="${escapeHtml(job.url)}" target="_blank" rel="noopener">${escapeHtml(job.title)}</a></div>
          <div class="kc-company">${escapeHtml(job.company)}</div>
          <div class="kc-meta">
            <span><span class="label">Location:</span> ${escapeHtml(job.location)}</span>
            <span>${escapeHtml(job.work_type || "—")}</span>
            <span>${escapeHtml(job.salary || "—")}</span>
          </div>
          ${skills.length > 0 ? `
          <div class="kc-skills">
            ${skills.map(s => `<span class="kc-skill ${matched.includes(s) ? "matched" : gap.includes(s) ? "gap" : ""}">${escapeHtml(s)}</span>`).join("")}
          </div>` : ""}
          <div class="kc-footer">
            <span class="kc-match">${job.match_score}%</span>
            <span class="kc-date">${job.date_applied ? fullDate(job.date_applied) : ""}</span>
          </div>
        </div>`;
    }

    function buildBoard(jobs) {
      const container = document.getElementById("boardContainer");

      if (jobs.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:48px; color:var(--color-text-muted);">
            No applications tracked yet.
            <br><br>
            <a href="/MOPSWork/jobs.html">Go to the Job Scanner</a> and set a status on jobs you're interested in.
          </div>`;
        return;
      }

      const groups = {};
      COLUMNS.forEach(c => { groups[c.key] = []; });
      jobs.forEach(j => {
        const s = j.status || "applied";
        if (groups[s]) groups[s].push(j);
        else groups.applied.push(j);
      });

      let html = `<div class="kanban-board">`;

      COLUMNS.forEach(col => {
        const items = groups[col.key] || [];

        html += `
          <div class="kanban-column" data-column="${col.key}">
            <div class="kanban-column-header">
              <div class="col-left">
                <span class="col-dot ${col.dot}"></span>
                <span class="col-title">${col.label}</span>
              </div>
              <span class="col-count">${items.length}</span>
            </div>
            <div class="kanban-cards" data-column="${col.key}">`;

        if (items.length === 0) {
          html += `<div class="kanban-empty">Drop cards here</div>`;
        } else {
          items.forEach(j => {
            html += createCardHTML(j);
          });
        }

        html += `
            </div>
          </div>`;
      });

      html += `</div>`;
      container.innerHTML = html;
      attachDragHandlers();
    }

    function attachDragHandlers() {
      document.querySelectorAll(".kanban-card[draggable]").forEach(card => {
        card.addEventListener("dragstart", onDragStart);
        card.addEventListener("dragend", onDragEnd);
      });

      document.querySelectorAll(".kanban-cards").forEach(zone => {
        zone.addEventListener("dragover", onDragOver);
        zone.addEventListener("dragleave", onDragLeave);
        zone.addEventListener("drop", onDrop);
      });
    }

    function onDragStart(e) {
      dragSource = this;
      this.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", this.dataset.jobId);
    }

    function onDragEnd() {
      this.classList.remove("dragging");
      document.querySelectorAll(".kanban-cards").forEach(z => z.classList.remove("drag-over"));
      dragSource = null;
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      this.classList.add("drag-over");
    }

    function onDragLeave() {
      this.classList.remove("drag-over");
    }

    function onDrop(e) {
      e.preventDefault();
      this.classList.remove("drag-over");
      const jobId = e.dataTransfer.getData("text/plain");
      const newStatus = this.dataset.column;
      if (!jobId || !newStatus) return;

      const sourceCard = document.querySelector(`.kanban-card[data-job-id="${jobId}"]`);
      if (!sourceCard) return;

      const oldStatus = sourceCard.dataset.status;
      if (oldStatus === newStatus) return;

      updateJobStatus(jobId, newStatus, sourceCard);
    }

    async function updateJobStatus(jobId, newStatus, sourceCard) {
      try {
        const cardJob = {
          job_id: jobId,
          title: sourceCard ? (sourceCard.querySelector(".kc-title") || {}).innerText : "",
          company: sourceCard ? (sourceCard.querySelector(".kc-company") || {}).innerText : "",
          url: sourceCard ? ((sourceCard.querySelector(".kc-title a") || {}).href || "") : "",
        };
        if (window.MopsTracker) window.MopsTracker.remember(cardJob, jobId, newStatus);
        const formData = new FormData();
        formData.append("status", newStatus);
        formData.append("title", cardJob.title || "");
        formData.append("company", cardJob.company || "");
        formData.append("url", cardJob.url || "");
        const resp = await fetch(`${API_BASE}/api/applications/${jobId}`, {
          method: "POST",
          body: formData,
        });
        if (!resp.ok) throw new Error("API error");
        loadApplications();
      } catch (err) {
        console.error("Failed to update status:", err);
        loadApplications();
      }
    }

    function recsToJobs(recs) {
      return (recs || []).filter(rec => rec && rec.status && rec.title).map(rec => ({
        job_id: rec.id,
        title: rec.title,
        company: rec.company || "",
        url: rec.url || "",
        status: rec.status,
        location: rec.location || "",
        match_score: rec.match_score || 0,
        date_applied: rec.date || "",
        key_skills: [],
        matched_skills: [],
        skills_gap: [],
      }));
    }

    async function loadApplications() {
      const container = document.getElementById("boardContainer");
      try {
        const resp = await fetch(`${API_BASE}/api/applications`);
        const apiJobs = resp.ok ? await resp.json() : [];
        const localJobs = window.MopsTracker ? recsToJobs(window.MopsTracker.allRecs()) : [];
        const byId = {};
        apiJobs.forEach(j => { if (j && j.job_id) byId[j.job_id] = j; });
        localJobs.forEach(j => {
          if (!j.job_id) {
            byId["local-" + (j.title || "") + "|" + (j.company || "")] = j;
            return;
          }
          if (byId[j.job_id]) {
            byId[j.job_id].status = j.status || byId[j.job_id].status;
            if (!byId[j.job_id].title) byId[j.job_id].title = j.title;
            if (!byId[j.job_id].company) byId[j.job_id].company = j.company;
          } else {
            byId[j.job_id] = j;
          }
        });
        allJobs = Object.values(byId);
        buildBoard(allJobs);
      } catch (err) {
        console.error("Failed to load applications:", err);
        const localJobs = window.MopsTracker ? recsToJobs(window.MopsTracker.allRecs()) : [];
        if (localJobs.length) {
          allJobs = localJobs;
          buildBoard(allJobs);
          return;
        }
        container.innerHTML = `
          <div style="text-align:center; padding:48px; color:var(--color-text-muted);">
            Could not load applications. Make sure the backend is running on port 8003.
          </div>`;
      }
    }

    window.__exportCSV = function() {
      window.open(`${API_BASE}/api/applications/export`, "_blank");
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", loadApplications);
    } else {
      loadApplications();
    }
  </script>
</body>
</html>
