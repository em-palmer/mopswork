<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/MOPSHub/favicon.svg" type="image/svg+xml">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Scanner — MOpsWork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="/MOPSWork/static/api-config.js"></script>
  <script src="/MOPSWork/static/tracker-store.js?v=1"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --color-bg: #f5f7fa;
      --color-surface: #ffffff;
      --color-surface-hover: #eef0f2;
      --color-border: #e9edf2;
      --color-text: #38444d;
      --color-text-muted: #64748b;
      --color-accent: #00739c;
      --color-accent-red: #bf1a22;
      --color-dark: #38444d;
      --color-success: #10b981;
      --color-warning: #f59e0b;
      --radius: 10px;
      --radius-lg: 12px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --max-width: 1400px;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: var(--color-accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--color-accent-red); }

    .container { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

    /* ── Sticky Header ── */
    .site-header {
      background: #ffffff;
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }
    .logo {
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--color-accent);
      letter-spacing: -0.02em;
      text-decoration: none;
    }
    .logo:hover { color: var(--color-accent); }
    .nav-links { display: flex; align-items: center; gap: 24px; list-style: none; }
    .nav-links a {
      color: #475569;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--color-accent); }

    /* ── Banner Hero ── */
    .banner {
      background: linear-gradient(135deg, #00739c 0%, #38444d 100%);
      color: #ffffff;
      padding: 64px 0 56px;
    }
    .banner-content {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }
    .banner-content h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }
    .banner-content p {
      font-size: 1.05rem;
      color: #cbd5e1;
      max-width: 600px;
    }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 10px; padding: 12px 28px;
      border-radius: 8px; font-family: var(--font); font-size: 0.9rem; font-weight: 600;
      border: none; cursor: pointer; transition: all 0.3s;
    }
    .btn-primary {
      background: #00739c; color: #fff;
    }
    .btn-primary:hover { background: #38444d; }
    .btn-sm { padding: 8px 20px; font-size: 0.85rem; }
    .btn-outline {
      background: transparent; color: var(--color-accent);
      border: 1px solid var(--color-accent); padding: 6px 16px; font-size: 0.78rem;
    }
    .btn-outline:hover { background: rgba(0, 115, 156, 0.06); }

    /* Profile / CV bar */
    .jobs-profile-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px; border-bottom: 1px solid var(--color-border);
      background: rgba(16, 185, 129, 0.04); flex-wrap: wrap; gap: 8px;
    }
    .jobs-profile-left { display: flex; align-items: center; gap: 8px; }
    .jobs-profile-label { font-size: 0.75rem; font-weight: 600; color: var(--color-text-muted); }
    .jobs-profile-right { display: flex; align-items: center; gap: 8px; }
    .profile-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.75rem; padding: 3px 10px; border-radius: 100px; font-weight: 500;
    }
    .profile-inactive { color: var(--color-text-muted); background: rgba(0,0,0,0.04); }
    .profile-active { color: #059669; background: rgba(16, 185, 129, 0.1); }
    .profile-dot { width: 6px; height: 6px; border-radius: 50%; background: #059669; }
    .profile-remove-btn {
      background: none; border: none; color: var(--color-text-muted); cursor: pointer;
      font-size: 1.1rem; line-height: 1; padding: 0 2px;
    }
    .profile-remove-btn:hover { color: var(--color-accent-red); }
    .jobs-cv-btn-wrapper { cursor: pointer; }
    .jobs-cv-toggle {
      display: flex; align-items: center; gap: 4px; font-size: 0.72rem; font-weight: 500;
      cursor: pointer; color: var(--color-text-muted); white-space: nowrap;
    }

    /* Widget */
    .jobs-widget {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); overflow: hidden;
    }
    .jobs-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--color-border); flex-wrap: wrap; gap: 12px;
    }
    .jobs-head-title { font-size: 1.1rem; font-weight: 700; }
    .jobs-head-meta {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.85rem; color: var(--color-text-muted); margin-top: 2px;
    }
    .jobs-head-meta strong { color: var(--color-accent); font-weight: 700; }
    .jobs-head-right { display: flex; align-items: center; gap: 12px; }

    /* Filters bar */
    .jobs-filters-bar {
      display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 20px;
      border-bottom: 1px solid var(--color-border); background: var(--color-surface-hover);
    }
    .jobs-filter-group {
      display: flex; flex-direction: column; gap: 2px;
    }
    .jobs-filter-group label {
      font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.4px; color: var(--color-text-muted);
    }
    .jobs-filter-select, .jobs-filter-input {
      padding: 6px 10px; border-radius: 6px; border: 1px solid var(--color-border);
      background: var(--color-surface); color: var(--color-text);
      font-family: var(--font); font-size: 0.78rem; outline: none; cursor: pointer;
      min-width: 120px; transition: border-color 0.2s;
    }
    .jobs-filter-input { min-width: 140px; cursor: text; }
    .jobs-filter-select:focus, .jobs-filter-input:focus { border-color: var(--color-accent); }

    /* Loading */
    .jobs-loading {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; padding: 32px; color: var(--color-text-muted); font-size: 0.9rem;
    }
    .jobs-loading.hidden { display: none; }
    .jobs-loading-spinner {
      width: 20px; height: 20px; border: 2px solid var(--color-border);
      border-top-color: var(--color-accent); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Table */
    .jobs-table-wrap { }
    .jobs-table { width: 100%; border-collapse: collapse; font-size: 0.72rem; table-layout: fixed; }
    .jobs-table th, .jobs-table td { overflow: hidden; text-overflow: ellipsis; }
    .jobs-table th {
      text-align: left; padding: 8px 6px; font-size: 0.62rem; font-weight: 600;
      color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.3px;
      border-bottom: 1px solid var(--color-border); background: var(--color-surface-hover);
    }
    .jobs-table td { padding: 8px 6px; border-bottom: 1px solid var(--color-border); vertical-align: top; }
    .jobs-table tbody tr:hover { background: var(--color-surface-hover); }

    .jobs-title-cell { min-width: 0; }
    .jobs-title { color: var(--color-text); font-weight: 600; font-size: 0.82rem; text-decoration: none; display: block; line-height: 1.3; }
    .jobs-title:hover { color: var(--color-accent); }
    .jobs-company { font-size: 0.7rem; color: var(--color-text-muted); display: block; margin-top: 1px; }
    .jobs-location { font-size: 0.72rem; color: var(--color-text-muted); max-width: 100px; }
    .jobs-work-type {
      display: inline-block; padding: 2px 6px; border-radius: 4px;
      font-size: 0.66rem; font-weight: 600;
    }
    .jobs-salary { font-size: 0.75rem; font-weight: 600; color: var(--color-text); white-space: nowrap; }

    .jobs-source {
      display: inline-block; padding: 2px 6px; border-radius: 100px;
      font-size: 0.6rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2px;
      background: rgba(0, 115, 156, 0.1); color: var(--color-accent); white-space: nowrap;
    }
    .jobs-source--remoteok { background: rgba(255, 107, 107, 0.08); color: #e74c3c; }
    .jobs-source--weworkremotely { background: rgba(6, 182, 212, 0.08); color: #06b6d4; }
    .jobs-source--adzuna { background: rgba(244, 63, 94, 0.08); color: #bf1a22; }
    .jobs-source--jobicy { background: rgba(245, 158, 11, 0.08); color: #d97706; }
    .jobs-source--googlejobs { background: rgba(0, 115, 156, 0.08); color: var(--color-accent); }
    .jobs-source--linkedin { background: rgba(10, 102, 194, 0.08); color: #0a66c2; }
    .jobs-source--revopsroles { background: rgba(16, 185, 129, 0.08); color: #059669; }
    .jobs-source--wttj { background: rgba(0, 115, 156, 0.08); color: var(--color-accent); }

    /* Score */
    .jobs-score { display: flex; flex-direction: column; gap: 1px; }
    .jobs-score-value { font-weight: 700; font-size: 0.8rem; }
    .jobs-score-label { font-size: 0.6rem; color: var(--color-text-muted); }
    .jobs-score-bar { height: 2px; border-radius: 1px; background: var(--color-border); margin-top: 2px; min-width: 30px; }
    .score-low .jobs-score-value { color: #bf1a22; }
    .score-low .jobs-score-bar { background: #bf1a22; }
    .score-mid .jobs-score-value { color: #d97706; }
    .score-mid .jobs-score-bar { background: #d97706; }
    .score-high .jobs-score-value { color: var(--color-success); }
    .score-high .jobs-score-bar { background: var(--color-success); }
    .jobs-score-detail { display: flex; flex-wrap: wrap; gap: 1px; margin-top: 1px; }
    .jobs-score-detail-tag { font-size: 0.55rem; padding: 0 3px; background: rgba(0, 115, 156, 0.06); border-radius: 2px; color: var(--color-text-muted); }

    .jobs-date { font-size: 0.7rem; color: var(--color-text-muted); white-space: nowrap; }

    /* Skills */
    .jobs-skills-list { display: flex; flex-wrap: wrap; gap: 1px; }
    .jobs-skill-tag { font-size: 0.6rem; padding: 0px 5px; border-radius: 3px; background: rgba(0, 115, 156, 0.06); color: var(--color-text-muted); border: 1px solid var(--color-border); white-space: nowrap; }
    .jobs-skill-tag.matched { background: rgba(16, 185, 129, 0.1); color: #059669; border-color: rgba(16, 185, 129, 0.2); }
    .jobs-skill-tag.gap { background: rgba(253, 121, 168, 0.06); color: #db2777; border-color: rgba(253, 121, 168, 0.15); }
    .jobs-no-skills { font-size: 0.7rem; color: var(--color-text-muted); }
    .jobs-company-link { font-size: 0.72rem; }
    .jobs-hiring-manager { font-size: 0.72rem; color: var(--color-text-muted); }

    /* Status */
    .jobs-status-select {
      padding: 3px 4px; border-radius: 4px; border: 1px solid var(--color-border);
      font-family: var(--font); font-size: 0.65rem; cursor: pointer; outline: none;
      background: var(--color-surface); color: var(--color-text-muted); width: 100%; max-width: 100px;
    }
    .jobs-status-select:focus { border-color: var(--color-accent); }
    .jobs-status-select.status-applied { color: #059669; border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.06); }
    .jobs-status-select.status-interviewing { color: #2563eb; border-color: rgba(37,99,235,0.3); background: rgba(37,99,235,0.06); }
    .jobs-status-select.status-offer { color: #00739c; border-color: rgba(0,115,156,0.3); background: rgba(0,115,156,0.06); }
    .jobs-status-select.status-withdrawn { color: #d97706; border-color: rgba(217,119,6,0.3); background: rgba(217,119,6,0.06); }
    .jobs-status-select.status-rejected { color: #dc2626; border-color: rgba(220,38,38,0.3); background: rgba(220,38,38,0.06); }

    .jobs-empty, .jobs-error { text-align: center; padding: 40px !important; color: var(--color-text-muted); font-size: 0.9rem; }

    .jobs-foot {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
      padding: 10px 20px; border-top: 1px solid var(--color-border); background: var(--color-surface-hover);
    }
    .jobs-foot-text { font-size: 0.72rem; color: var(--color-text-muted); }

    /* ── Footer ── */
    .site-footer {
      background: #ffffff;
      border-top: 1px solid var(--color-border);
      padding: 20px 0;
      margin-top: auto;
    }
    .footer-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
      text-align: left;
    }
    .site-footer p {
      font-size: 0.825rem;
      color: #94a3b8;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .jobs-filters-bar { flex-direction: column; }
      .jobs-filter-select, .jobs-filter-input { width: 100%; min-width: unset; }
      .jobs-table { font-size: 0.78rem; }
    }
    @media (max-width: 768px) {
      .jobs-head { flex-direction: column; align-items: flex-start; }
      .jobs-head-right .btn-sm { width: 100%; justify-content: center; }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--color-bg); }
    ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">MOpsWork</a>
      <nav class="nav-links">
        <a href="/MOPSWork/jobs.html" style="color: var(--color-accent); font-weight: 600;">Job Scanner</a>
        <a href="/MOPSWork/applications.html">Applications</a>
        <a href="/MOPSWork/skills-in-demand.html">Skills</a>
        <a href="/MOPSWork/samples.html">Samples</a>
        <a href="/MOPSWork/aboutme.html">About Me</a>
      </nav>
    </div>
  </header>

  <section class="banner">
    <div class="banner-content">
      <h1>Smart Job Scanner</h1>
      <p>Live results from multiple job boards, scored against your personal criteria. Use the filters to narrow down.</p>
    </div>
  </section>

  <div class="container" style="flex: 1;">
    <div data-jobs-widget="mount"></div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; 2026 MOpsWork. All rights reserved.</p>
    </div>
  </footer>

  <script src="/MOPSWork/static/jobs-widget.js?v=8"></script>
</body>
</html>
